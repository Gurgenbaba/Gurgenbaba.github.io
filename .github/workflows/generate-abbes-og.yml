name: Generate ABBES social preview

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_abbes_og.py"
      - ".github/workflows/generate-abbes-og.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate ABBES share image
        run: python scripts/generate_abbes_og.py

      - name: Commit generated asset
        shell: bash
        run: |
          if git diff --quiet -- assets/img/brand/abbes-og-1200x630.jpg; then
            echo "No social-preview change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/brand/abbes-og-1200x630.jpg
          git commit -m "feat(brand): generate ABBES social preview"
          git push
